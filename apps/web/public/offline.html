<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="theme-color" content="#111912" />
    <title>You're offline · Wiloplay</title>
    <style>
      :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#080c09;color:#eef6eb}

      body{align-items:center;display:flex;justify-content:center;margin:0;min-height:100vh;padding:24px}
      main{background:radial-gradient(ellipse at 50% 0,#b5ff721c,transparent 55%),#111912;border:1px solid #29382c;border-radius:24px;max-width:440px;padding:38px;text-align:center}
      .mark{align-items:center;background:linear-gradient(135deg,#b5ff72,#78d84e);border-radius:16px;color:#10200c;display:inline-flex;height:58px;justify-content:center;width:58px}
      h1{font-size:clamp(25px,7vw,34px);letter-spacing:-1.3px;margin:24px 0 10px}
      p{color:#a7b3a5;font-size:14px;line-height:1.7;margin:0}
      a{background:#b5ff72;border-radius:999px;color:#12200e;display:inline-flex;font-size:13px;font-weight:700;margin-top:26px;padding:12px 20px;text-decoration:none}
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 64 64" width="36" height="36" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="4"><path d="M14 25v14m8-21v28m8-34v40m8-27v14m8-22v30m8-22v14" /></svg></span>

      <p>Reconnect to explore Wiloplay, play music, and catch up with your artists.</p>
